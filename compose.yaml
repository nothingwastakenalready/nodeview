services:
  raffael:
    build: .
    ports:
      - "${RAFFAEL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - ./services.yaml:/config/services.yaml:ro
      - raffael-data:/data
    environment:
      RAFFAEL_MAIL_PROVIDER: ${RAFFAEL_MAIL_PROVIDER:-mailpit}
      RAFFAEL_SMTP_HOST: ${RAFFAEL_SMTP_HOST:-mailpit}
      RAFFAEL_SMTP_PORT: ${RAFFAEL_SMTP_PORT:-1025}
      RAFFAEL_MAIL_FROM: ${RAFFAEL_MAIL_FROM:-no-reply@localhost}
      RAFFAEL_PUBLIC_URL: ${RAFFAEL_PUBLIC_URL:-http://127.0.0.1:8080}
      RAFFAEL_UNIFI_URL: ${RAFFAEL_UNIFI_URL:-}
      RAFFAEL_UNIFI_USERNAME: ${RAFFAEL_UNIFI_USERNAME:-}
      RAFFAEL_UNIFI_PASSWORD: ${RAFFAEL_UNIFI_PASSWORD:-}
      RAFFAEL_UNIFI_API_KEY: ${RAFFAEL_UNIFI_API_KEY:-}
      RAFFAEL_UNIFI_SITE: ${RAFFAEL_UNIFI_SITE:-default}
      RAFFAEL_UNIFI_VERIFY_TLS: ${RAFFAEL_UNIFI_VERIFY_TLS:-1}
      RAFFAEL_API_CLIENTS_URL: ${RAFFAEL_API_CLIENTS_URL:-}
      RAFFAEL_API_CLIENTS_TOKEN: ${RAFFAEL_API_CLIENTS_TOKEN:-}
      RAFFAEL_SNMP_TARGETS: ${RAFFAEL_SNMP_TARGETS:-}
      RAFFAEL_SNMP_COMMUNITY: ${RAFFAEL_SNMP_COMMUNITY:-public}
      RAFFAEL_SNMP_PORT: ${RAFFAEL_SNMP_PORT:-161}
    depends_on:
      - mailpit
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  raffael-data:
